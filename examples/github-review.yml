name: ZeroOne Ops Review

# This review-only workflow never runs remediation setup or validation commands.
# Set the repository variable ZERO_ONE_OPS_VERSION to upgrade deliberately.
# In a larger pipeline, keep this as one final-stage invocation after producers.
# Rerun the PR-triggered job to retry. Manual dispatch does not select a PR.

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

# Do not cancel an in-flight overview/inline publication on a newer head.
concurrency:
  group: zeroone-ops-review-${{ github.repository }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  zeroone-ops-review:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/<owner>/zeroone-ops:${{ vars.ZERO_ONE_OPS_VERSION || '1.0.0' }}

    env:
      ZEROONE_OPS_EXECUTION_MODE: ci
      ZEROONE_OPS_CONFIG: .zeroone-ops.json
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.4-mini
      # Optional MLflow tracing. Enable only when a reachable tracking server is
      # configured for this environment.
      # ZEROONE_MLFLOW_ENABLED: "true"
      # MLFLOW_TRACKING_URI: "https://mlflow.example.internal"
      # MLFLOW_EXPERIMENT_NAME: "zeroone-ops-review"
      # Keep request settings tight in CI so an unreachable tracking server does
      # not stall review runs for too long.
      # MLFLOW_HTTP_REQUEST_TIMEOUT: "5"
      # MLFLOW_HTTP_REQUEST_MAX_RETRIES: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Mark workspace as safe for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run review
        run: zeroone-ops review

# The smallest GitHub review config shape is:
#
# {
#   "platform": "github",
#   "base_branch": "main",
#   "review": {
#     "inline_comments_enabled": false
#   },
#   "github": {
#     "labels": []
#   }
# }
