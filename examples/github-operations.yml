name: ZeroOne Ops Operations

# Privileged jobs check out protected default-branch configuration. Treat
# remediation setup and validation commands as executable CI policy.
# Set the repository variable ZERO_ONE_OPS_VERSION to upgrade deliberately.

on:
  workflow_dispatch:
  issue_comment:
    types: [created, edited]
  pull_request_target:
    types: [closed]
  schedule:
    # Run the finding, remediation, and lifecycle jobs once per day.
    - cron: "0 7 * * *"

jobs:
  findings-sync:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/<owner>/zeroone-ops:${{ vars.ZERO_ONE_OPS_VERSION || '0.56.0' }}
    permissions:
      contents: read
      issues: write
    env:
      ZEROONE_OPS_EXECUTION_MODE: ci
      ZEROONE_OPS_CONFIG: .zeroone-ops.json
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Check out default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Install uv for the target repository
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-groups --locked

      - name: Generate example SARIF artifact with Ruff
        run: |
          mkdir -p artifacts
          set +e
          uv run ruff check . \
            --output-format sarif \
            --output-file artifacts/ruff.sarif
          status=$?
          if [ "$status" -gt 1 ]; then
            echo "Ruff SARIF generation failed with exit code $status." >&2
            exit "$status"
          fi
          echo "Ruff SARIF generation completed with exit code $status."

      - name: Sync promoted findings
        run: zeroone-ops findings sync

  remediate:
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') &&
      needs.findings-sync.result == 'success'
    needs: findings-sync
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/<owner>/zeroone-ops:${{ vars.ZERO_ONE_OPS_VERSION || '0.56.0' }}
    concurrency:
      group: zeroone-ops-remediation-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      ZEROONE_OPS_EXECUTION_MODE: ci
      ZEROONE_OPS_CONFIG: .zeroone-ops.json
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GIT_AUTHOR_NAME: ZeroOne Ops
      GIT_AUTHOR_EMAIL: zeroone-ops@example.com
      GIT_COMMITTER_NAME: ZeroOne Ops
      GIT_COMMITTER_EMAIL: zeroone-ops@example.com
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # Override with a repository variable when a different model is needed.
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-mini' }}

    steps:
      - name: Check out default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Install uv for the target repository
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-groups --locked

      - name: Configure Git author
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"

      - name: Run one remediation work item
        run: zeroone-ops remediation run

  sync-status:
    if: >-
      (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true) ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/<owner>/zeroone-ops:${{ vars.ZERO_ONE_OPS_VERSION || '0.56.0' }}
    concurrency:
      group: zeroone-ops-remediation-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    env:
      ZEROONE_OPS_EXECUTION_MODE: ci
      ZEROONE_OPS_CONFIG: .zeroone-ops.json
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Check out default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Install uv for the target repository
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-groups --locked

      - name: Reconcile work-item lifecycle
        run: zeroone-ops work-items sync-status

  policy:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null &&
      contains(github.event.issue.labels.*.name, 'zeroone-policy')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/<owner>/zeroone-ops:${{ vars.ZERO_ONE_OPS_VERSION || '0.56.0' }}
    permissions:
      contents: read
      issues: write
    env:
      ZEROONE_OPS_EXECUTION_MODE: ci
      ZEROONE_OPS_CONFIG: .zeroone-ops.json
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Check out default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Install uv for the target repository
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-groups --locked

      - name: Process policy commands
        run: zeroone-ops dashboard policy

  recovery:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null &&
      contains(github.event.issue.labels.*.name, 'zeroone-work-item')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/<owner>/zeroone-ops:${{ vars.ZERO_ONE_OPS_VERSION || '0.56.0' }}
    concurrency:
      group: zeroone-ops-remediation-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    env:
      ZEROONE_OPS_EXECUTION_MODE: ci
      ZEROONE_OPS_CONFIG: .zeroone-ops.json
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Check out default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Install uv for the target repository
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-groups --locked

      - name: Process recovery command
        run: zeroone-ops work-items recover

# Copy examples/.zeroone-ops.github.json to .zeroone-ops.json before enabling
# this workflow. The configuration declares artifacts/ruff.sarif as an example
# SARIF source and controls remediation promotion through bootstrap policy
# settings. The workflow owns finding sync, remediation, lifecycle convergence,
# policy commands, and recovery commands. Replace the Ruff generation, artifact
# path, and toolchain setup with any SARIF producer used by your repository.
