stages:
  - zeroone-ops-fix
  - zeroone-ops-review

.zeroone_ops_base:
  image:
    name: ghcr.io/justinmelger/zeroone-ops:latest
    entrypoint: [""]
  interruptible: false
  variables:
    ZEROONE_OPS_EXECUTION_MODE: "ci"
    ZEROONE_OPS_CONFIG: ".zeroone-ops.json"
    GIT_STRATEGY: clone
    GIT_DEPTH: "0"
    GITLAB_URL: "https://${CI_SERVER_HOST}"
    OPENAI_MODEL: "gpt-5.4-mini"
    # Define these as masked and protected CI/CD variables:
    # GITLAB_TOKEN
    # OPENAI_API_KEY

# Discovery-only dashboard sync.
# Keep this separate from remediation so operators can validate dashboard state
# without also mutating the repository.
zeroone_ops_dashboard:
  extends: .zeroone_ops_base
  stage: zeroone-ops-fix
  resource_group: zeroone-ops-dashboard
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $RUN_ZEROONE_OPS_DASHBOARD == "true"'
      when: manual
    - when: never
  variables:
    # Define these as masked and protected CI/CD variables where applicable:
    # SONARQUBE_URL
    # SONARQUBE_TOKEN
    # SONARQUBE_PROJECT_KEY
    # GITLAB_TOKEN
  script:
    - uv run --project /opt/zeroone-ops zeroone-ops dashboard sonar

# Dedicated dashboard policy processing.
# Keep this separate so operator-issued policy commands do not depend on
# remediation or reconciliation runs.
zeroone_ops_dashboard_policy:
  extends: .zeroone_ops_base
  stage: zeroone-ops-fix
  resource_group: zeroone-ops-dashboard-policy
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $RUN_ZEROONE_OPS_DASHBOARD_POLICY == "true"'
      when: manual
    - when: never
  variables:
    # Define these as masked and protected CI/CD variables:
    # GITLAB_TOKEN
  script:
    - uv run --project /opt/zeroone-ops zeroone-ops dashboard policy

# Dashboard-backed remediation workflow.
# Keep this separate from discovery, but run it after dashboard sync in the
# same pipeline when both jobs are enabled so remediation acts on freshly
# refreshed dashboard state.
zeroone_ops_dashboard_remediate:
  extends: .zeroone_ops_base
  stage: zeroone-ops-fix
  resource_group: zeroone-ops-dashboard-remediate
  needs:
    - job: zeroone_ops_dashboard
      optional: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $RUN_ZEROONE_OPS_DASHBOARD_REMEDIATE == "true"'
      when: manual
    - when: never
  variables:
    GIT_AUTHOR_NAME: "ZeroOne Ops"
    GIT_AUTHOR_EMAIL: "zeroone-ops@example.com"
    GIT_COMMITTER_NAME: "ZeroOne Ops"
    GIT_COMMITTER_EMAIL: "zeroone-ops@example.com"
    # Define these as masked and protected CI/CD variables:
    # GITLAB_TOKEN
    # OPENAI_API_KEY
  before_script:
    - git config user.name "$GIT_AUTHOR_NAME"
    - git config user.email "$GIT_AUTHOR_EMAIL"
    - set +x
    - >
      git remote set-url origin
      "https://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script:
    - uv run --project /opt/zeroone-ops zeroone-ops dashboard remediate

# Dashboard reconciliation workflow.
# Keep this as a separate later lifecycle job rather than chaining it directly
# after remediation in the same pipeline.
zeroone_ops_dashboard_reconcile:
  extends: .zeroone_ops_base
  stage: zeroone-ops-fix
  resource_group: zeroone-ops-dashboard-reconcile
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $RUN_ZEROONE_OPS_DASHBOARD_RECONCILE == "true"'
      when: manual
    - when: never
  variables:
    # Define these as masked and protected CI/CD variables:
    # GITLAB_TOKEN
  script:
    - uv run --project /opt/zeroone-ops zeroone-ops dashboard reconcile

# Merge request review workflow.
# Prefer the merge_request_event manual trigger for the first smoke test so the
# bot reviews only the current merge request through CI_MERGE_REQUEST_IID.
zeroone_ops_review:
  extends: .zeroone_ops_base
  stage: zeroone-ops-review
  resource_group: zeroone-ops-review
  rules:
    - if: '$CI_MERGE_REQUEST_IID && $CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $RUN_ZEROONE_OPS_REVIEW == "true"'
      when: manual
    - when: never
  script:
    - uv run --project /opt/zeroone-ops zeroone-ops review
