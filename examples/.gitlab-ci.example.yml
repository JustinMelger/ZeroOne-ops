stages:
  - zeroone-ops-fix
  - zeroone-ops-review

.zeroone_ops_base:
  image:
    name: ghcr.io/justinmelger/zeroone-ops:latest
    entrypoint: [""]
  interruptible: false
  variables:
    ZEROONE_OPS_EXECUTION_MODE: "ci"
    ZEROONE_OPS_CONFIG: ".zeroone-ops.json"
    GIT_STRATEGY: clone
    GIT_DEPTH: "0"
    GITLAB_URL: "https://${CI_SERVER_HOST}"
    OPENAI_MODEL: "gpt-5.4-mini"
    # Optional MLflow tracing. Enable only when a reachable tracking server is
    # configured for this environment.
    # ZEROONE_MLFLOW_ENABLED: "true"
    # MLFLOW_TRACKING_URI: "https://mlflow.example.internal"
    # MLFLOW_EXPERIMENT_NAME: "zeroone-ops-review"
    # Keep request settings tight in CI so an unreachable tracking server does
    # not stall review or remediation runs for too long.
    # MLFLOW_HTTP_REQUEST_TIMEOUT: "5"
    # MLFLOW_HTTP_REQUEST_MAX_RETRIES: "1"
    # Define these as masked and protected CI/CD variables:
    # GITLAB_TOKEN
    # OPENAI_API_KEY

# Finding sync.
# Keep this separate from remediation so operators can validate dashboard state
# without also mutating the repository. This collects SonarQube findings and
# any configured SARIF artifacts.
zeroone_ops_findings_sync:
  extends: .zeroone_ops_base
  stage: zeroone-ops-fix
  resource_group: zeroone-ops-findings-sync
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $RUN_ZEROONE_OPS_FINDINGS_SYNC == "true"'
      when: manual
    - when: never
  variables:
    # Define these as masked and protected CI/CD variables where applicable:
    # SONARQUBE_URL
    # SONARQUBE_TOKEN
    # SONARQUBE_PROJECT_KEY
    # GITLAB_TOKEN
  script:
    - zeroone-ops findings sync

# Dedicated dashboard policy processing.
# Keep this separate so operator-issued policy commands do not depend on
# remediation or reconciliation runs.
zeroone_ops_dashboard_policy:
  extends: .zeroone_ops_base
  stage: zeroone-ops-fix
  resource_group: zeroone-ops-dashboard-policy
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $RUN_ZEROONE_OPS_DASHBOARD_POLICY == "true"'
      when: manual
    - when: never
  variables:
    # Define these as masked and protected CI/CD variables:
    # GITLAB_TOKEN
  script:
    - zeroone-ops dashboard policy

# Dashboard remediation recovery commands.
# GitLab dashboard notes do not emit a native pipeline event, so process these
# on a schedule or through an explicit default-branch manual pipeline.
zeroone_ops_work_items_recover:
  extends: .zeroone_ops_base
  stage: zeroone-ops-fix
  resource_group: zeroone-ops-remediation
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $RUN_ZEROONE_OPS_WORK_ITEMS_RECOVER == "true"'
      when: manual
    - when: never
  variables:
    # Define this as a masked and protected CI/CD variable:
    # GITLAB_TOKEN
  script:
    - zeroone-ops work-items recover

# Remediation workflow.
# Keep this separate from finding sync, but run it after finding sync in the
# same pipeline when both jobs are enabled so remediation acts on freshly
# refreshed dashboard state.
zeroone_ops_remediation:
  extends: .zeroone_ops_base
  stage: zeroone-ops-fix
  resource_group: zeroone-ops-remediation
  needs:
    - job: zeroone_ops_findings_sync
      optional: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $RUN_ZEROONE_OPS_REMEDIATION == "true"'
      when: manual
    - when: never
  variables:
    GIT_AUTHOR_NAME: "ZeroOne Ops"
    GIT_AUTHOR_EMAIL: "zeroone-ops@example.com"
    GIT_COMMITTER_NAME: "ZeroOne Ops"
    GIT_COMMITTER_EMAIL: "zeroone-ops@example.com"
    # Define these as masked and protected CI/CD variables:
    # GITLAB_TOKEN
    # OPENAI_API_KEY
  before_script:
    - export GIT_CONFIG_GLOBAL="/tmp/gitconfig-${CI_JOB_ID}"
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - git config user.name "$GIT_AUTHOR_NAME"
    - git config user.email "$GIT_AUTHOR_EMAIL"
    - set +x
    - >
      git remote set-url origin
      "https://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script:
    - zeroone-ops remediation run
  after_script:
    - rm -f "$GIT_CONFIG_GLOBAL"

# Work-item lifecycle workflow.
# Keep this as a separate later lifecycle job rather than chaining it directly
# after remediation in the same pipeline.
zeroone_ops_work_items_sync_status:
  extends: .zeroone_ops_base
  stage: zeroone-ops-fix
  resource_group: zeroone-ops-work-items-sync-status
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $RUN_ZEROONE_OPS_WORK_ITEMS_SYNC_STATUS == "true"'
      when: manual
    - when: never
  variables:
    # Define these as masked and protected CI/CD variables:
    # GITLAB_TOKEN
  script:
    - zeroone-ops work-items sync-status

# Merge request review workflow.
# Prefer the merge_request_event manual trigger for the first smoke test so the
# bot reviews only the current merge request through CI_MERGE_REQUEST_IID.
# If MLflow tracing is enabled, this is the best first job to point at a shared
# tracking server because it exercises the staged review flow without changing
# repository state.
zeroone_ops_review:
  extends: .zeroone_ops_base
  stage: zeroone-ops-review
  resource_group: zeroone-ops-review
  rules:
    - if: '$CI_MERGE_REQUEST_IID && $CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $RUN_ZEROONE_OPS_REVIEW == "true"'
      when: manual
    - when: never
  before_script:
    - export GIT_CONFIG_GLOBAL="/tmp/gitconfig-${CI_JOB_ID}"
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
  script:
    - zeroone-ops review
  after_script:
    - rm -f "$GIT_CONFIG_GLOBAL"
