# Supported ZeroOne Ops GitLab CI include template. The root .gitlab-ci.yml
# owns stage order and must declare `zeroone-ops-fix` before `zeroone-ops-review`.

variables:
  # Keep this release pin aligned with the supported ZeroOne Ops version.
  # Project/group variables may override it when operators upgrade deliberately.
  ZERO_ONE_OPS_VERSION: "0.56.0"
  OPERATION: ""
  ZEROONE_STATIC_CODE_SCAN_DIRECTORIES: "."
  ZEROONE_RUFF_SCAN_ENABLED: "true"
  ZEROONE_MYPY_SCAN_ENABLED: "true"
  PYTHON_VERSION: "3.13"
  RUFF_VERSION: "0.14.0"
  MYPY_VERSION: "1.18.2"
  MYPY_TO_SARIF_SCRIPT: "scripts/mypy_to_sarif.py"
  UV_VERSION: "0.11.8"

.zeroone_ops_base:
  image:
    name: ghcr.io/justinmelger/zeroone-ops:${ZERO_ONE_OPS_VERSION}
    entrypoint: [""]
  interruptible: false
  variables:
    ZEROONE_OPS_EXECUTION_MODE: "ci"
    ZEROONE_OPS_CONFIG: ".zeroone-ops.json"
    GIT_STRATEGY: clone
    GIT_DEPTH: "0"
    GITLAB_URL: $CI_SERVER_URL
    OPENAI_MODEL: "gpt-5.4-mini"
    # Optional MLflow tracing. Enable only when a reachable tracking server is
    # configured for this environment.
    # ZEROONE_MLFLOW_ENABLED: "true"
    # MLFLOW_TRACKING_URI: "https://mlflow.example.internal"
    # MLFLOW_EXPERIMENT_NAME: "zeroone-ops"
    # MLFLOW_HTTP_REQUEST_TIMEOUT: "5"
    # MLFLOW_HTTP_REQUEST_MAX_RETRIES: "1"
    # Define these as masked and protected CI/CD variables:
    # GITLAB_TOKEN
    # OPENAI_API_KEY
    # Privileged jobs must use protected default-branch configuration. Remediation
    # setup and validation commands are executable CI policy and run only in the
    # control-plane remediation path below.

# One scheduled or web-triggered default-branch pipeline with
# OPERATION=zeroone_ops runs the operational DAG. All operational jobs share
# these rules so their dependencies remain valid.
.zeroone_ops_scheduled:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "schedule" && $OPERATION == "zeroone_ops"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "web" && $OPERATION == "zeroone_ops"'
    - when: never

.zeroone_ruff_scan:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "schedule" && $OPERATION == "zeroone_ops" && $ZEROONE_RUFF_SCAN_ENABLED != "false"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "web" && $OPERATION == "zeroone_ops" && $ZEROONE_RUFF_SCAN_ENABLED != "false"'
    - when: never

.zeroone_mypy_scan:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "schedule" && $OPERATION == "zeroone_ops" && $ZEROONE_MYPY_SCAN_ENABLED != "false"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "web" && $OPERATION == "zeroone_ops" && $ZEROONE_MYPY_SCAN_ENABLED != "false"'
    - when: never

.zeroone_ops_remediation_git_setup:
  before_script:
    - export GIT_CONFIG_GLOBAL="/tmp/gitconfig-${CI_JOB_ID}"
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - git config user.name "${GIT_AUTHOR_NAME:-ZeroOne Ops}"
    - git config user.email "${GIT_AUTHOR_EMAIL:-zeroone-ops@example.com}"
    - set +x
    - >
      git remote set-url origin
      "https://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    # uv is repository validation tooling, not a base-image dependency.
    - curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
    - export PATH="$HOME/.local/bin:$PATH"
  after_script:
    - rm -f "$GIT_CONFIG_GLOBAL"

# Optional SARIF producers. Replace the scan directories or disable either
# producer with its ZEROONE_*_SCAN_ENABLED variable when it is not configured.
zeroone_ops_ruff_sarif:
  extends: .zeroone_ruff_scan
  image: python:${PYTHON_VERSION}
  stage: zeroone-ops-fix
  before_script:
    - mkdir -p artifacts
    - pip install "ruff==${RUFF_VERSION}"
  script:
    - >
      ruff check $ZEROONE_STATIC_CODE_SCAN_DIRECTORIES --exit-zero
      --output-format sarif --output-file artifacts/ruff.sarif
  artifacts:
    when: always
    paths:
      - artifacts/ruff.sarif

zeroone_ops_mypy_sarif:
  extends: .zeroone_mypy_scan
  image: python:${PYTHON_VERSION}
  stage: zeroone-ops-fix
  before_script:
    - mkdir -p artifacts
    - pip install "mypy==${MYPY_VERSION}"
  script:
    - |
      set +e
      mypy $ZEROONE_STATIC_CODE_SCAN_DIRECTORIES --output json --no-error-summary > artifacts/mypy.json
      mypy_exit=$?
      set -e
      if [ "$mypy_exit" -ne 0 ] && [ "$mypy_exit" -ne 1 ]; then
        exit "$mypy_exit"
      fi
    # Copy examples/mypy_to_sarif.py into the configured repository-local path.
    - python "$MYPY_TO_SARIF_SCRIPT" artifacts/mypy.json artifacts/mypy.sarif
  artifacts:
    when: always
    paths:
      - artifacts/mypy.json
      - artifacts/mypy.sarif

# Lifecycle runs first so merged or closed remediation merge requests converge
# before the next finding sync and promotion decision.
zeroone_ops_work_items_sync_status:
  extends: [.zeroone_ops_base, .zeroone_ops_scheduled]
  stage: zeroone-ops-fix
  resource_group: zeroone-ops-work-items-sync-status
  script:
    - zeroone-ops work-items sync-status

# Finding sync collects configured SonarQube findings and any SARIF artifacts.
# Run a repository-owned SonarQube scanner job before this job when needed.
zeroone_ops_findings_sync:
  extends: [.zeroone_ops_base, .zeroone_ops_scheduled]
  stage: zeroone-ops-fix
  resource_group: zeroone-ops-findings-sync
  needs:
    - job: zeroone_ops_work_items_sync_status
    - job: zeroone_ops_ruff_sarif
      artifacts: true
      optional: true
    - job: zeroone_ops_mypy_sarif
      artifacts: true
      optional: true
  script:
    - zeroone-ops findings sync

# GitLab issue-mode control plane. It processes policy and recovery commands,
# then attempts one remediation after the latest finding sync.
zeroone_ops_control_plane:
  extends: [.zeroone_ops_base, .zeroone_ops_scheduled, .zeroone_ops_remediation_git_setup]
  stage: zeroone-ops-fix
  resource_group: zeroone-ops-remediation
  needs:
    - job: zeroone_ops_findings_sync
  variables:
    GIT_AUTHOR_NAME: "ZeroOne Ops"
    GIT_AUTHOR_EMAIL: "zeroone-ops@example.com"
    GIT_COMMITTER_NAME: "ZeroOne Ops"
    GIT_COMMITTER_EMAIL: "zeroone-ops@example.com"
  script:
    - zeroone-ops control-plane run

# Review is separate from privileged scheduled operations and never runs
# remediation setup or validation commands.
zeroone_ops_review:
  extends: .zeroone_ops_base
  stage: zeroone-ops-review
  resource_group: zeroone-ops-review
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      allow_failure: true
    - when: never
  script:
    - zeroone-ops review
