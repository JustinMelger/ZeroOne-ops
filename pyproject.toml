[project]
name = "zeroone-ops"
version = "0.43.0"
description = "ZeroOne Ops automates GitLab review and remediation workflows."
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
  "gitpython>=3.1.50",
  "httpx>=0.28.1",
  "mako>=1.3.12",
  "mlflow-tracing>=3.13.0",
  "openai>=2.43.0",
  "pip==26.1.2",
  "pip-audit>=2.10.0",
  "pydantic>=2.13.4",
  "python-dotenv>=1.2.2",
  "typer>=0.26.7",
  "urllib3==2.7.0",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.9.4",
  "import-linter>=2.11",
  "mypy>=2.1.0",
  "pip-audit>=2.10.0",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.15.16",
]

[project.scripts]
zeroone-ops = "zeroone_ops.cli:main"
ai-sonar-bot = "zeroone_ops.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zeroone_ops"]

[tool.hatch.build.targets.wheel.package-data]
"zeroone_ops" = ["prompts/*.txt", "py.typed"]

[tool.hatch.build.targets.sdist]
include = [
  "src/zeroone_ops/**/*.py",
  "src/zeroone_ops/prompts/*.txt",
  "src/zeroone_ops/py.typed",
  "README.md",
]

[tool.uv]
default-groups = ["dev"]
exclude-newer = "14 days"

[tool.uv.exclude-newer-package]
# Temporary security overrides; remove once these releases fall within the
# global exclude-newer window.
mlflow-tracing = "2026-06-02T00:00:00Z"

[dependency-groups]
dev = [
  "bandit>=1.9.4",
  "import-linter>=2.11",
  "mypy>=2.1.0",
  "pip-audit>=2.10.0",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.15.16",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "D",
  "E",
  "F",
  "I",
  "PLC0415",
  "UP",
  "B",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"samples/**/*.py" = ["E712"]
"tests/**/*.py" = ["D"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["zeroone_ops"]
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=zeroone_ops --cov-report=term-missing --cov-fail-under=80"
