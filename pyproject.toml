[project]
name = "zeroone-ops"
version = "0.29.1"
description = "ZeroOne Ops automates GitLab review and remediation workflows."
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
  "httpx>=0.28.1",
  "openai>=1.99.0",
  "pip-audit>=2.10.0",
  "pydantic>=2.11.3",
  "python-dotenv>=1.0.1",
  "typer>=0.16.0",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.8.3",
  "import-linter>=2.3",
  "mypy>=1.15.0",
  "pip-audit>=2.9.0",
  "pytest>=8.3.5",
  "pytest-cov>=6.1.1",
  "ruff>=0.11.4",
]

[project.scripts]
zeroone-ops = "zeroone_ops.cli:main"
ai-sonar-bot = "zeroone_ops.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zeroone_ops"]

[tool.hatch.build.targets.wheel.package-data]
"zeroone_ops" = ["prompts/*.txt", "py.typed"]

[tool.hatch.build.targets.sdist]
include = [
  "src/zeroone_ops/**/*.py",
  "src/zeroone_ops/prompts/*.txt",
  "src/zeroone_ops/py.typed",
  "README.md",
]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
  "bandit>=1.8.3",
  "import-linter>=2.3",
  "mypy>=1.15.0",
  "pip-audit>=2.9.0",
  "pytest>=8.3.5",
  "pytest-cov>=6.1.1",
  "ruff>=0.11.4",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "D",
  "E",
  "F",
  "I",
  "UP",
  "B",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"samples/**/*.py" = ["E712"]
"tests/**/*.py" = ["D"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["zeroone_ops"]
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=zeroone_ops --cov-report=term-missing --cov-fail-under=80"
