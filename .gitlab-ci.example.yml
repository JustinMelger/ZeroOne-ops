stages:
  - ai-fix
  - ai-review

.ai_sonar_bot_base:
  image:
    name: ghcr.io/justinmelger/ai-sonar-bot:latest
    entrypoint: [""]
  interruptible: false
  variables:
    AI_SONAR_BOT_EXECUTION_MODE: "ci"
    AI_SONAR_BOT_CONFIG: ".ai-sonar-bot.json"
    GIT_STRATEGY: clone
    GIT_DEPTH: "0"
    GITLAB_URL: "https://${CI_SERVER_HOST}"
    OPENAI_MODEL: "gpt-5.4-mini"
    # Define these as protected CI/CD variables:
    # GITLAB_TOKEN
    # OPENAI_API_KEY

# Discovery-only dashboard sync.
# Keep this separate from remediation so operators can validate dashboard state
# without also mutating the repository.
ai_sonar_bot_dashboard:
  extends: .ai_sonar_bot_base
  stage: ai-fix
  resource_group: ai-sonar-bot-dashboard
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $RUN_AI_SONAR_BOT_DASHBOARD == "true"'
      when: manual
    - when: never
  variables:
    # Define these as protected CI/CD variables:
    # SONARQUBE_URL
    # SONARQUBE_TOKEN
    # SONARQUBE_PROJECT_KEY
    # GITLAB_TOKEN
    # OPENAI_API_KEY
  script:
    - uv run --project /opt/ai-sonar-bot ai-sonar-bot dashboard sonar

# Dashboard-backed remediation workflow.
# Keep this separate from discovery so operators can validate dashboard state
# independently from repository mutation.
ai_sonar_bot_dashboard_remediate:
  extends: .ai_sonar_bot_base
  stage: ai-fix
  resource_group: ai-sonar-bot-dashboard-remediate
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $RUN_AI_SONAR_BOT_DASHBOARD_REMEDIATE == "true"'
      when: manual
    - when: never
  variables:
    GIT_AUTHOR_NAME: "AI Sonar Bot"
    GIT_AUTHOR_EMAIL: "ai-sonar-bot@example.com"
    GIT_COMMITTER_NAME: "AI Sonar Bot"
    GIT_COMMITTER_EMAIL: "ai-sonar-bot@example.com"
    # Define these as protected CI/CD variables:
    # GITLAB_TOKEN
    # OPENAI_API_KEY
  before_script:
    - git config user.name "$GIT_AUTHOR_NAME"
    - git config user.email "$GIT_AUTHOR_EMAIL"
    - >
      git remote set-url origin
      "https://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script:
    - uv run --project /opt/ai-sonar-bot ai-sonar-bot dashboard remediate

# Dashboard reconciliation workflow.
# Run this after dashboard-backed remediation so merged or closed merge
# requests can move dashboard items out of mr_opened.
ai_sonar_bot_dashboard_reconcile:
  extends: .ai_sonar_bot_base
  stage: ai-fix
  resource_group: ai-sonar-bot-dashboard-reconcile
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $RUN_AI_SONAR_BOT_DASHBOARD_RECONCILE == "true"'
      when: manual
    - when: never
  variables:
    # Define these as protected CI/CD variables:
    # GITLAB_TOKEN
    # OPENAI_API_KEY
  script:
    - uv run --project /opt/ai-sonar-bot ai-sonar-bot dashboard reconcile

# Merge request review workflow.
# Prefer the merge_request_event manual trigger for the first smoke test so the
# bot reviews only the current merge request through CI_MERGE_REQUEST_IID.
ai_sonar_bot_review:
  extends: .ai_sonar_bot_base
  stage: ai-review
  resource_group: ai-sonar-bot-review
  rules:
    - if: '$CI_MERGE_REQUEST_IID && $CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $RUN_AI_SONAR_BOT_REVIEW == "true"'
      when: manual
    - when: never
  script:
    - uv run --project /opt/ai-sonar-bot ai-sonar-bot review
