stages:
  - ai-fix

ai_sonar_bot:
  stage: ai-fix
  image: registry.example.com/group/project/ai-sonar-bot:latest
  interruptible: false
  resource_group: ai-sonar-bot
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $RUN_AI_SONAR_BOT == "true"'
      when: manual
    - when: never
  variables:
    AI_SONAR_BOT_EXECUTION_MODE: "ci"
    AI_SONAR_BOT_CONFIG: ".ai-sonar-bot.json"
    GIT_STRATEGY: clone
    GIT_DEPTH: "0"
    GIT_AUTHOR_NAME: "AI Sonar Bot"
    GIT_AUTHOR_EMAIL: "ai-sonar-bot@example.com"
    GIT_COMMITTER_NAME: "AI Sonar Bot"
    GIT_COMMITTER_EMAIL: "ai-sonar-bot@example.com"
  before_script:
    - git config user.name "$GIT_AUTHOR_NAME"
    - git config user.email "$GIT_AUTHOR_EMAIL"
  script:
    - uv run --project /opt/ai-sonar-bot ai-sonar-bot
