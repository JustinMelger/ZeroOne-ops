name: GitHub Work-Item Lifecycle

on:
  workflow_dispatch:
  pull_request_target:
    types: [closed]
  schedule:
    # Recovery for stale claims, manually closed PRs, and missed event runs.
    - cron: "15 7 * * *"

concurrency:
  # Serialize lifecycle transitions with remediation for one repository.
  group: zeroone-ops-remediation-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  sync-status:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    env:
      ZEROONE_OPS_EXECUTION_MODE: ci
      ZEROONE_OPS_CONFIG: .zeroone-ops.json
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Check out default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Reconcile work-item lifecycle
        run: uv run zeroone-ops work-items sync-status
