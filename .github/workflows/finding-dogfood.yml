name: Finding Dogfood

on:
  workflow_dispatch:

jobs:
  ruff-sarif:
    runs-on: ubuntu-latest

    env:
      ZEROONE_OPS_CONFIG: .zeroone-ops-finding-dogfood.json
      GITLAB_URL: https://gitlab.example.com
      GITLAB_TOKEN: dry-run-token
      GITLAB_PROJECT_ID: 123

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Write SARIF-only dogfood config
        run: |
          cat <<'EOF' > "$ZEROONE_OPS_CONFIG"
          {
            "execution_mode": "ci",
            "platform": "github",
            "base_branch": "main",
            "remediation": {
              "target_branch": "main",
              "bootstrap_severities": ["LOW"]
            },
            "sarif": {
              "artifact_paths": ["artifacts/ruff.sarif"]
            },
            "github": {
              "labels": ["zeroone-ops", "sonarqube"]
            },
            "state": {
              "path": ".zeroone-ops-state.json"
            }
          }
          EOF

      - name: Emit Ruff SARIF artifact
        run: |
          mkdir -p artifacts
          set +e
          uv run ruff check samples/ruff_findings \
            --isolated \
            --select E712,F841 \
            --output-format sarif \
            --output-file artifacts/ruff.sarif
          status=$?
          echo "ruff_exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
        id: emit_sarif

      - name: Upload Ruff SARIF artifact
        uses: actions/upload-artifact@v5
        with:
          name: ruff-sarif
          path: artifacts/ruff.sarif

      - name: Dry-run finding intake
        run: uv run zeroone-ops dashboard sonar --dry-run

      - name: Report Ruff finding count signal
        run: |
          echo "Ruff SARIF generation completed with exit code ${{ steps.emit_sarif.outputs.ruff_exit_code }}."
