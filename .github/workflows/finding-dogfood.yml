name: Finding Dogfood

on:
  workflow_dispatch:

jobs:
  ruff-sarif:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    env:
      ZEROONE_OPS_CONFIG: .zeroone-ops-finding-dogfood.json
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Write SARIF-only dogfood config
        run: |
          cat <<'EOF' > "$ZEROONE_OPS_CONFIG"
          {
            "execution_mode": "ci",
            "platform": "github",
            "base_branch": "main",
            "remediation": {
              "target_branch": "main",
              "bootstrap_severities": ["medium", "high"]
            },
            "sarif": {
              "artifact_paths": ["artifacts/ruff.sarif"]
            },
            "github": {
              "labels": []
            },
            "state": {
              "path": ".zeroone-ops-state.json"
            }
          }
          EOF

      - name: Emit Ruff SARIF artifact
        run: |
          mkdir -p artifacts
          set +e
          uv run ruff check samples/ruff_findings \
            --isolated \
            --select E712,F841 \
            --output-format sarif \
            --output-file artifacts/ruff.sarif
          status=$?
          echo "ruff_exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
        id: emit_sarif

      - name: Upload Ruff SARIF artifact
        uses: actions/upload-artifact@v5
        with:
          name: ruff-sarif
          path: artifacts/ruff.sarif

      - name: Publish promoted GitHub findings
        run: uv run zeroone-ops findings sync

      - name: Report Ruff finding count signal
        run: |
          echo "Ruff SARIF generation completed with exit code ${{ steps.emit_sarif.outputs.ruff_exit_code }}."
