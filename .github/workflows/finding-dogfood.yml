name: Finding Dogfood

on:
  workflow_dispatch:

jobs:
  finding-sarif:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    env:
      ZEROONE_OPS_CONFIG: .zeroone-ops-finding-dogfood.json
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Write SARIF-only dogfood config
        run: |
          cat <<'EOF' > "$ZEROONE_OPS_CONFIG"
          {
            "execution_mode": "ci",
            "platform": "github",
            "base_branch": "main",
            "remediation": {
              "target_branch": "main",
              "bootstrap_severities": ["medium", "high"],
              "max_active_work_items": 5
            },
            "sarif": {
              "artifacts": [
                {
                  "path": "artifacts/mypy.sarif",
                  "source_id": "mypy-sarif"
                },
                {
                  "path": "artifacts/ruff.sarif",
                  "source_id": "ruff-sarif"
                }
              ]
            },
            "github": {
              "labels": []
            },
            "state": {
              "path": ".zeroone-ops-state.json"
            }
          }
          EOF

      - name: Emit MyPy SARIF artifact for tests
        run: |
          mkdir -p artifacts
          set +e
          uv run mypy --output json tests > artifacts/mypy.json
          result=$?
          uv run python examples/mypy_to_sarif.py artifacts/mypy.json artifacts/mypy.sarif
          echo "mypy_exit_code=$result" >> "$GITHUB_OUTPUT"
          exit 0
        id: emit_mypy_sarif

      - name: Emit focused Ruff SARIF artifact
        run: |
          set +e
          uv run ruff check \
            src/zeroone_ops/services/review/pipeline/review_candidate_generation_service.py \
            src/zeroone_ops/services/review/publish/review_publisher.py \
            --isolated \
            --select SIM103,SIM114 \
            --output-format sarif \
            --output-file artifacts/ruff.sarif
          result=$?
          echo "ruff_exit_code=$result" >> "$GITHUB_OUTPUT"
          exit 0
        id: emit_ruff_sarif

      - name: Upload finding SARIF artifacts
        uses: actions/upload-artifact@v7
        with:
          name: finding-sarif
          path: artifacts/*.sarif

      - name: Publish promoted GitHub findings
        run: uv run zeroone-ops findings sync

      - name: Report finding source signals
        run: |
          echo "MyPy JSON generation completed with exit code ${{ steps.emit_mypy_sarif.outputs.mypy_exit_code }}."
          echo "Ruff SARIF generation completed with exit code ${{ steps.emit_ruff_sarif.outputs.ruff_exit_code }}."
