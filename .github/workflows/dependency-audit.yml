name: Dependency Audit

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  pip-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Run pip-audit
        run: |
          # Temporary ignore until pip 26.1.2 is available within our update window.
          # Temporary ignore until cryptography 48.0.1 is available within our update window.
          # Temporary ignore until msgpack 1.2.1 is available within our update window.
          uv run pip-audit --ignore-vuln PYSEC-2026-196 --ignore-vuln GHSA-537c-gmf6-5ccf --ignore-vuln GHSA-6v7p-g79w-8964
