name: Publish Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.2.0"
        required: false
        type: string
  release:
    types:
      - published
  push:
    tags:
      - "v*.*.*"
      - "ai-sonar-bot-v*.*.*"
      - "ai-code-ops-v*.*.*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Resolve release tag
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            raw_tag="${{ inputs.tag }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            raw_tag="${{ github.event.release.tag_name }}"
          else
            raw_tag="${{ github.ref_name }}"
          fi
          semver_tag="${raw_tag#ai-sonar-bot-}"
          semver_tag="${semver_tag#ai-code-ops-}"
          echo "raw_tag=${raw_tag}" >> "$GITHUB_OUTPUT"
          echo "semver_tag=${semver_tag}" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.ref.outputs.raw_tag }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.ref.outputs.semver_tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.ref.outputs.semver_tag }}
            type=semver,pattern={{major}},value=${{ steps.ref.outputs.semver_tag }}
            type=raw,value=latest

      - name: Build smoke-test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ai-code-ops:smoke

      - name: Smoke test container CLI
        run: |
          docker run --rm ai-code-ops:smoke --help
          docker run --rm ai-code-ops:smoke review --help
          docker run --rm ai-code-ops:smoke dashboard --help

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate build provenance
        if: ${{ github.event.repository.private == false }}
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
